name: sharecrm-platform
label: 纷享销客 ShareCRM
kind: platform
version: 1.2.2
description: 纷享销客企信 IM Gateway 插件 for Hermes Agent
author: scutken
homepage: https://github.com/scutken/hermes-sharecrm
license: MIT
tags: [messaging, sharecrm, fxiaoke, qixin]
requires_env:
  - name: SHARECRM_APP_ID
    description: "应用 ID"
    prompt: "App ID"
    password: false
  - name: SHARECRM_APP_SECRET
    description: "应用密钥"
    prompt: "App Secret"
    password: true
optional_env:
  - name: SHARECRM_BASE_URL
    description: "接口地址，留空则使用 https://open.fxiaoke.com"
    prompt: "Base URL (https://open.fxiaoke.com)"
    password: false
  - name: SHARECRM_SSE_VERSION
    description: "SSE 协议版本，默认 1.4.0；低于 1.4.0 收不到图片/图文"
    prompt: "SSE version (1.4.0)"
    password: false
  - name: SHARECRM_MAX_MESSAGE_LENGTH
    description: "单条消息最大长度，默认 4096，超长自动分片"
    prompt: "Max message length (4096)"
    password: false
  - name: SHARECRM_INCLUDE_HISTORY
    description: "是否把群聊 history_messages 作为上下文注入，默认 true"
    prompt: "Include history (true/false)"
    password: false
  - name: SHARECRM_MENTION_NAMES
    description: "群聊 @机器人 的显示名，逗号分隔（如 二哈）；用于剥掉命令前缀，让 @二哈 /new 生效"
    prompt: "Bot mention names"
    password: false
  - name: SHARECRM_ALLOWED_USERS
    description: "允许的用户 ID，逗号分隔（如 E.82846.1230）。留空则私聊走 pairing"
    prompt: "Allowed users"
    password: false
  - name: SHARECRM_ALLOW_ALL_USERS
    description: "设为 true 允许所有用户（仅开发测试）"
    prompt: "Allow all users (true/false)"
    password: false
  - name: SHARECRM_HOME_CHANNEL
    description: "定时通知投递目标 chat_id；也可在会话里发 /sethome"
    prompt: "Home channel"
    password: false
